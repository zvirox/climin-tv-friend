name: Release Climin UI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x launcher/gradlew

      - name: Compile Climin UI Release APK
        run: |
          cd launcher
          ./gradlew assembleRelease --console=plain

      - name: Prepare Release Assets & Checksums
        id: prepare_assets
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          APK_DIR="launcher/app/build/outputs/apk/release"
          RAW_APK="$APK_DIR/app-release.apk"

          if [ ! -f "$RAW_APK" ]; then
            echo "ERROR: Release APK was not found at $RAW_APK" >&2
            exit 1
          fi

          NAMED_APK="Climin-UI-${TAG_NAME}.apk"
          cp "$RAW_APK" "$NAMED_APK"

          # Generate SHA256 checksum
          sha256sum "$NAMED_APK" > "${NAMED_APK}.sha256"

          APK_SIZE=$(ls -lh "$NAMED_APK" | awk '{print $5}')
          echo "Compiled APK Size: $APK_SIZE"

          echo "apk_path=$NAMED_APK" >> $GITHUB_OUTPUT
          echo "sha_path=${NAMED_APK}.sha256" >> $GITHUB_OUTPUT
          echo "raw_apk=$RAW_APK" >> $GITHUB_OUTPUT
          echo "apk_size=$APK_SIZE" >> $GITHUB_OUTPUT

      - name: Extract Release Notes from Changelog
        id: release_notes
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#v}"
          python3 -c '
          import sys, re
          version = sys.argv[1]
          try:
              with open("docs/changelog.md", "r") as f:
                  content = f.read()
              pattern = rf"##\s*\[{re.escape(version)}\][^\n]*\n(.*?)(?=\n##\s*\[|\Z)"
              match = re.search(pattern, content, re.DOTALL)
              if match:
                  notes = match.group(1).strip()
              else:
                  notes = f"Release {version} of Climin UI and Climin TV Friend."
          except Exception:
              notes = f"Release {version} of Climin UI and Climin TV Friend."

          with open("RELEASE_BODY.md", "w") as out:
              out.write(notes + "\n")
          ' "$VERSION"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Climin UI ${{ github.ref_name }} (Stable Release)
          body_path: RELEASE_BODY.md
          draft: false
          prerelease: false
          files: |
            ${{ steps.prepare_assets.outputs.apk_path }}
            ${{ steps.prepare_assets.outputs.sha_path }}
            ${{ steps.prepare_assets.outputs.raw_apk }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
